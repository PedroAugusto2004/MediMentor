service: medimentor

provider:
  name: aws
  runtime: nodejs18.x
  region: ${opt:region, 'us-east-1'}

functions:
  api:
    handler: server.handler  # Points to `server.js`
    events:
      - http:
          path: analyze-symptoms
          method: post
          cors: true
      - http:
          path: analyze-symptoms
          method: get
          cors: true
      - http:
          path: predictive-text
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - Origin
              - Accept
            allowCredentials: false
    environment:
      NODE_ENV: production

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3000
