<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediMentor</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="shortcut icon" href="assets/images/logo1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@5.0.3/dist/amazon-cognito-identity.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aws-amplify@4.3.15/dist/aws-amplify.min.js"></script>
    <script src="https://apis.google.com/js/platform.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="assets/images/logo1.png" alt="MediMentor Logo" class="logo-img">
                <span>MediMentor</span>
            </div>
        </nav>
        <div class="header-controls">
            <div class="theme-toggle">
                <input type="radio" id="light" name="theme" value="light">
                <label for="light"><i class="fas fa-sun"></i></label>
                <input type="radio" id="dark" name="theme" value="dark">
                <label for="dark"><i class="fas fa-moon"></i></label>
                <input type="radio" id="system" name="theme" value="system" checked>
                <label for="system"><i class="fas fa-desktop"></i></label>
            </div>
                
            <!-- Logout Button -->
            <button class="Btn" id="logout-btn">
                <div class="sign">
                    <svg viewBox="0 0 512 512">
                        <path d="M377.9 105.9L500.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L377.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1-128 0c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM160 96L96 96c-17.7 0-32 14.3-32 32l0 256c0 17.7 14.3 32 32 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-64 0c-53 0-96-43-96-96L0 128C0 75 43 32 96 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32z"></path>
                    </svg>
                </div>
                <div class="text">Logout</div>
            </button>
    
    <!-- Logout Confirmation Popup -->
    <div id="logout-popup" class="popup">
        <div class="popup-content">
            <p>Are you sure you want to log out?</p>
            <button id="confirm-logout">Yes</button>
            <button id="cancel-logout">No</button>
        </div>
    </div>

<!-- Login Popup -->
<div id="login-popup" class="popup">
    <div class="popup-content">
        <p>Log in to use MediMentor</p>
        <button id="redirect-login">Log In</button>
    </div>
</div>

        </div>
    </header>

    <main>
        <section id="chatbot">
            <div id="chatWindow">
                <div id="chatOutput"></div>
            </div>
            <div id="chat-window"></div>
            <div id="chatInputContainer">
                <input type="text" id="chatInput" placeholder="Type your message..." required>
                <input type="date" id="dateInput" class="hidden">
                <button id="sendButton">Send</button>
                <button id="restartButton" class="restartButton">
                    <span>↺</span>
                </button>
            </div>
            <div class="disclaimer">
                MediMentor can make mistakes. Check important info.
            </div>
            <div id="genderSelection" class="hidden">
                <button class="optionButton" data-value="male">Male</button>
                <button class="optionButton" data-value="female">Female</button>
            </div>
            <div id="regionSelection" class="hidden">
                <button class="optionButton" data-value="north-america">North America</button>
                <button class="optionButton" data-value="europe">Europe</button>
                <button class="optionButton" data-value="asia">Asia</button>
                <button class="optionButton" data-value="africa">Africa</button>
                <button class="optionButton" data-value="south-america">South America</button>
                <button class="optionButton" data-value="australia">Australia</button>
            </div>
            <div style="position: absolute; bottom: 10px; left: 10px; display: flex; align-items: center; font-size: 0.8rem;">
                <span>Powered by</span>
                <a href="https://www.isabelhealthcare.com" target="_blank" style="margin-left: 5px;">
                    <img src="assets/images/isabel.png" alt="Isabel Healthcare" style="width: 50px; height: auto;">
                </a>
            </div>
        </section>
        <div id="loadingSpinner" class="hidden">
            <div class="spinner"></div>
            <p>Analyzing symptoms...</p>
        </div>
    </main>

    <script src="scripts/chatbot.js"></script>
    <script src="scripts/auth.js"></script>

</body>
</html>
