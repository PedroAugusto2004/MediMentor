<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediMentor - Welcome</title>
    <link rel="stylesheet" href="styles/index.css">
    <link rel="shortcut icon" href="assets/images/logo1.png">
    <script src="https://cdn.jsdelivr.net/npm/aws-amplify@4.3.15/dist/aws-amplify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@5.0.3/dist/amazon-cognito-identity.min.js"></script>
    <script src="https://apis.google.com/js/platform.js"></script>
    <meta name="google-signin-client_id" content="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com">
</head>
<body>
    <video class="background-video" autoplay muted loop playsinline>
        <source src="assets/videos/medi.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <div class="container">
        <!-- Welcome section -->
        <div class="welcome-section">
            <h1>Welcome to MediMentor!</h1>
            <p>Your personal guide to better health and well-being. Skip the confusion and get personalized recommendations, powered by advanced AI technology.</p>
            <div class="powered-by">
                <span>Powered by</span>
                <a href="https://aws.amazon.com" target="_blank">
                    <img src="assets/images/AWSlogo.png" alt="AWS Logo">
                </a>
            </div>
        </div>
        <!-- Login section -->
        <div class="login-section">
            <h2>Welcome!</h2>
            <form id="login-form">
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <button type="submit" class="login-now">Login Now</button>
                <p>Don't have an account?</p>
                <button type="button" id="signup-btn" class="signup-now">Sign Up</button>
            </form>
            <div class="helper-text">
                <p><a href="#">Forgot password?</a></p>
            </div>
        </div>
        <!-- Sign-up section -->
        <div class="signup-section">
            <h2>Create Your Account</h2>
            <form id="signup-form">
                <input type="text" placeholder="Full Name" required>
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <button type="submit" class="signup-now">Sign Up</button>
                <button type="button" id="back-to-login-btn" class="back-to-login">Back to Login</button>
            </form>
        </div>
    </div>
    <div class="attribution">
        <p>Video by <a href="https://www.freepik.com/free-video/medical-supplies-care_3743265#fromView=search&page=1&position=21&uuid=ff9ab050-113e-4b2f-9627-bdcc72b74a14" target="_blank">freepik</a></p>
    </div>
    <script type="module" src="scripts/index.js"></script>
    <script>
        document.getElementById('signup-btn').addEventListener('click', function() {
            document.querySelector('.login-section').style.display = 'none';
            document.querySelector('.signup-section').style.display = 'flex';
        });

        document.getElementById('back-to-login-btn').addEventListener('click', function() {
            document.querySelector('.signup-section').style.display = 'none';
            document.querySelector('.login-section').style.display = 'flex';
        });
    </script>
</body>
</html>
