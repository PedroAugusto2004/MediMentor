<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediMentor ChatBot</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="shortcut icon" href="assets/images/logo.JPG">
</head>
<body>
    <header>
        <nav>
            <div class="logo">MediMentor</div>
            <ul class="nav-links">
                <li><a href="#about">About</a></li>
                <li><a href="#features">Features</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
        <label class="ui-switch">
            <input type="checkbox" id="themeToggle">
            <div class="slider">
                <div class="circle"></div>
            </div>
        </label>
    </header>

    <main>
        <section id="chatbot">
            <div id="chatWindow">
                <div id="chatOutput"></div>
            </div>
            <div id="chatInputContainer">
                <input type="text" id="chatInput" placeholder="Type your message..." required>
                <button id="sendButton">Send</button>
            </div>
            <div id="genderSelection" class="hidden">
                <button class="optionButton" data-value="male">Male</button>
                <button class="optionButton" data-value="female">Female</button>
            </div>
            <div id="regionSelection" class="hidden">
                <button class="optionButton" data-value="north-america">North America</button>
                <button class="optionButton" data-value="europe">Europe</button>
                <button class="optionButton" data-value="asia">Asia</button>
                <button class="optionButton" data-value="africa">Africa</button>
                <button class="optionButton" data-value="south-america">South America</button>
                <button class="optionButton" data-value="australia">Australia</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 MediMentor. All Rights Reserved.</p>
    </footer>

    <script src="scripts/chatbot.js"></script>
</body>
</html>
