<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediMentor</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="shortcut icon" href="assets/images/logo1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="assets/images/logo1.png" alt="MediMentor Logo" class="logo-img">
                <span>MediMentor</span>
            </div>
        </nav>
        <div class="theme-toggle">
            <input type="radio" id="light" name="theme" value="light">
            <label for="light"><i class="fas fa-sun"></i></label>
            <input type="radio" id="dark" name="theme" value="dark">
            <label for="dark"><i class="fas fa-moon"></i></label>
            <input type="radio" id="system" name="theme" value="system" checked>
            <label for="system"><i class="fas fa-desktop"></i></label>
        </div>
    </header>

    <main>
        <section id="chatbot">
            <div id="chatWindow">
                <div id="chatOutput"></div>
            </div>
            <div id="chatInputContainer">
                <input type="text" id="chatInput" placeholder="Type your message..." required>
                <input type="date" id="dateInput" class="hidden">
                <button id="sendButton">Send</button>
                <button id="restartButton" class="restartButton">
                    <span>↺</span>
                </button>
            </div>
            <div id="genderSelection" class="hidden">
                <button class="optionButton" data-value="male">Male</button>
                <button class="optionButton" data-value="female">Female</button>
            </div>
            <div id="regionSelection" class="hidden">
                <button class="optionButton" data-value="north-america">North America</button>
                <button class="optionButton" data-value="europe">Europe</button>
                <button class="optionButton" data-value="asia">Asia</button>
                <button class="optionButton" data-value="africa">Africa</button>
                <button class="optionButton" data-value="south-america">South America</button>
                <button class="optionButton" data-value="australia">Australia</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 MediMentor. All Rights Reserved.</p>
    </footer>

    <script src="scripts/chatbot.js"></script>
</body>
</html>
