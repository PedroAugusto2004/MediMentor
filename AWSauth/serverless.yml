service: medimentor-auth

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 128
  timeout: 10
  environment:
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID}
    COGNITO_USER_POOL_WEB_CLIENT_ID: ${env:COGNITO_USER_POOL_WEB_CLIENT_ID}
    COGNITO_REGION: ${env:COGNITO_REGION}

functions:
  app:
    handler: server.handler
    events:
      - http:
          path: auth/login
          method: post
          cors: true
      - http:
          path: auth/signup
          method: post
          cors: true
      - http:
          path: auth/confirm
          method: post
          cors: true
      - http:
          path: auth/resend-code
          method: post
          cors: true
  forgotPassword:
    handler: handler.forgotPassword
    events:
      - http:
          path: forgot-password
          method: post

plugins:
  - serverless-dotenv-plugin
  - serverless-offline

custom:
  dotenv:
    path: ../.env
  serverless-offline:
    httpPort: 3000
    noPrependStageInUrl: true
